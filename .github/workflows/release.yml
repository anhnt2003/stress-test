name: Release

# Đẩy tag dạng v0.5.0 (hoặc bấm "Run workflow") để xuất bản build Windows / macOS / Linux và gắn vào GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        # shell: bash = bash -eo pipefail: mã thoát của godot không bị `| tee` che mất
        shell: bash
    env:
      GODOT_VERSION: 4.4.1
      # secrets không dùng trực tiếp trong `if:` được, nên đưa vào biến môi trường của job
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Tải Godot và export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm -f godot.zip templates.tpz

      - name: Import tài nguyên
        run: godot --headless --path . --import

      - name: Kiểm thử trước khi xuất
        run: |
          godot --headless --path . --script res://tests/run_all.gd 2>&1 | tee tests.log
          if grep -q "SCRIPT ERROR" tests.log; then echo "::error::Có lỗi script khi chạy kiểm thử"; exit 1; fi

      - name: Xuất bản build
        run: |
          mkdir -p build/windows build/linux build/macos dist
          godot --headless --path . --export-release "Windows" build/windows/StressTest.exe
          godot --headless --path . --export-release "Linux" build/linux/StressTest.x86_64
          godot --headless --path . --export-release "macOS" build/macos/StressTest.zip
          VER="${GITHUB_REF_NAME//\//-}"   # nhánh có dấu "/" (chạy tay) không làm hỏng tên file
          (cd build/windows && zip -q -r "../../dist/StressTest-${VER}-windows.zip" .)
          (cd build/linux && chmod +x StressTest.x86_64 && tar -czf "../../dist/StressTest-${VER}-linux.tar.gz" .)
          cp build/macos/StressTest.zip "dist/StressTest-${VER}-macos.zip"
          ls -la dist

      - name: Gắn vào GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Lưu bản build (chạy tay)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-builds
          path: dist/*

      - name: Đẩy lên itch.io (nếu đã cấu hình BUTLER_API_KEY và ITCH_TARGET)
        if: startsWith(github.ref, 'refs/tags/') && env.BUTLER_API_KEY != '' && vars.ITCH_TARGET != ''
        env:
          ITCH_TARGET: ${{ vars.ITCH_TARGET }}
        run: |
          curl -sSL -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push build/windows "${ITCH_TARGET}:windows" --userversion "${GITHUB_REF_NAME}"
          ./butler/butler push build/linux "${ITCH_TARGET}:linux" --userversion "${GITHUB_REF_NAME}"
          ./butler/butler push build/macos/StressTest.zip "${ITCH_TARGET}:mac" --userversion "${GITHUB_REF_NAME}"
