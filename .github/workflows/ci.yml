name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        # shell: bash = bash -eo pipefail: mã thoát của godot không bị `| tee` che mất
        shell: bash
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Tải Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip

      - name: Import tài nguyên + kiểm tra cú pháp mọi script
        run: |
          godot --headless --path . --import 2>&1 | tee import.log
          # `! grep` không làm bash -e dừng nếu không phải lệnh cuối, nên kiểm tra bằng if
          if grep -q "SCRIPT ERROR" import.log; then echo "::error::Có lỗi script khi import"; exit 1; fi

      - name: Kiểm thử (tính điểm, ghế, cài đặt, Cỗ Máy, 10 cửa, mạng)
        run: |
          godot --headless --path . --script res://tests/run_all.gd 2>&1 | tee tests.log
          # lỗi runtime chỉ huỷ hàm đang chạy nên có thể vẫn in "ok": bắt cả SCRIPT ERROR
          if grep -q "SCRIPT ERROR" tests.log; then echo "::error::Có lỗi script khi chạy kiểm thử"; exit 1; fi

      - name: Chạy thử cả trận 10 cửa (bot, có chơi xấu)
        run: |
          godot --headless --fixed-fps 60 --path . -- --shot=/tmp/none.png --match --phase=400 2>&1 | tee match.log
          if grep -q "SCRIPT ERROR" match.log; then echo "::error::Có lỗi script trong trận mô phỏng"; exit 1; fi
          grep -q "RESULT door=10" match.log
          grep -q "FINAL totals=" match.log

      - name: Chơi qua mạng (máy chủ + máy khách trên cùng máy, trễ giả lập 100 ms)
        run: |
          godot --headless --path . -- --host --autostart=4 --quit-after=30 > host.log 2>&1 &
          sleep 2
          godot --headless --path . -- --join=127.0.0.1 --name=ci --net-test --net-lag=100 --quit-after=25 2>&1 | tee client.log
          wait
          grep -q "NETTEST OK" client.log
          if grep -q "SCRIPT ERROR" host.log client.log; then echo "::error::Có lỗi script khi chơi qua mạng"; exit 1; fi
          # lỗi engine (ví dụ gửi gói tới kết nối đã đóng), trừ cảnh báo rò tài nguyên lúc thoát của engine
          if grep "ERROR:" host.log client.log | grep -vq "resources still in use at exit"; then echo "::error::Có lỗi engine khi chơi qua mạng"; exit 1; fi
