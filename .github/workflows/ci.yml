name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.4.1
    steps:
      - uses: actions/checkout@v4

      - name: Tải Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip

      - name: Import tài nguyên + kiểm tra cú pháp mọi script
        run: |
          godot --headless --path . --import 2>&1 | tee import.log
          ! grep -q "SCRIPT ERROR" import.log

      - name: Kiểm thử (tính điểm, ghế, cài đặt, Cỗ Máy, 10 cửa, mạng)
        run: godot --headless --path . --script res://tests/run_all.gd

      - name: Chạy thử cả trận 10 cửa (bot, có chơi xấu)
        run: |
          godot --headless --fixed-fps 60 --path . -- --shot=/tmp/none.png --match --phase=400 2>&1 | tee match.log
          ! grep -q "SCRIPT ERROR" match.log
          grep -q "RESULT door=10" match.log
          grep -q "FINAL totals=" match.log
