# Máy chủ mai mối cho chơi online (Cloudflare Workers, gói miễn phí: Durable Object dùng SQLite).
name = "stress-test-signal"
main = "src/index.js"
compatibility_date = "2026-10-15"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# TURN (tuỳ chọn, cho mạng chặn kết nối trực tiếp): đặt TURN_URLS (vd "turn:a.example:3478,turns:a.example:443")
# và TURN_SECRET (bí mật dùng chung với máy chủ TURN, chuẩn TURN REST API / coturn use-auth-secret) bằng
# `wrangler secret put`. Người chơi chỉ nhận mật khẩu tạm thời 4 giờ.
